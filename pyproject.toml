[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-identity-transfer-learning"
version = "0.1.0"
description = "Binary animal identity recognition with VGG16 transfer learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "torchvision>=0.18,<1", "Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
